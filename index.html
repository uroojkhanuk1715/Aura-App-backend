<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600&family=Allura&display=swap">
<style>
/* Layout: a phone-sized app card centred on the page; five tabs, bottom nav, sheets and panels slide over the card. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14181F; --muted:#667085; --line:#E1E6EC;
  --accent:#F29100; --accent-ink:#2A1800; --heart:#E5384F; --chip:#F1F4F7; --good:#12805C; --warn:#B45400;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D10; --surface:#14181D; --ink:#F1F3F6; --muted:#8C95A3; --line:#252B33; --accent:#FFA62B; --accent-ink:#2A1800; --chip:#1D2229; --good:#3DD68C; --warn:#FFB454; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D10; --surface:#14181D; --ink:#F1F3F6; --muted:#8C95A3; --line:#252B33; --accent:#FFA62B; --accent-ink:#2A1800; --chip:#1D2229; --good:#3DD68C; --warn:#FFB454; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#shell{height:100%;display:grid;place-items:center}
#app{position:relative;width:100%;max-width:410px;height:100%;max-height:860px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
#screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;overscroll-behavior:contain}
.screen.on{display:block}
.logo{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.logo i{width:10px;height:10px;background:var(--accent);transform:rotate(45deg);border-radius:2px;display:block}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.iconrow{display:flex;gap:6px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;position:relative}
.ib:hover{background:var(--chip)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--heart);border:2px solid var(--surface)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;flex:none}
.av.sm{width:34px;height:34px;font-size:13px}
.av.lg{width:84px;height:84px;font-size:30px}
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px;flex:none}
.story .ring{padding:3px;border-radius:50%;background:conic-gradient(var(--accent),#ff5e62,var(--accent))}
.story .ring.seen{background:var(--line)}
.story .ring .av{border:3px solid var(--surface);width:56px;height:56px}
.story span{font-size:12px;color:var(--muted);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story .add{position:relative}
.story .add b{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;line-height:1;border:2px solid var(--surface)}
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px}
.phead .who{flex:1;min-width:0}
.phead strong{display:block;font-weight:600}
.phead small{color:var(--muted);font-size:12px}
.media{width:100%;aspect-ratio:4/5;background-size:cover;background-position:center;position:relative;user-select:none}
.media .burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.burst svg{fill:#fff;stroke:#fff;width:96px;height:96px;opacity:0;transform:scale(.4);filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.burst.go svg{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.acts{display:flex;align-items:center;gap:2px;padding:6px 10px 0}
.acts .sp{flex:1}
.acts .ib.liked svg,.rc .liked svg{fill:var(--heart);stroke:var(--heart)}
.acts .ib.saved svg{fill:currentColor}
.ptext{padding:0 16px;display:grid;gap:3px}
.ptext .likes{font-weight:600}
.ptext .more{color:var(--muted);text-align:left}
.vip{display:inline-grid;place-items:center;vertical-align:-3px;margin-left:4px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FFD25A,#F29100);color:#2A1800}
.vip svg{width:11px;height:11px;fill:currentColor;stroke:none}
.searchbar{position:sticky;top:0;z-index:5;padding:12px 16px;background:var(--surface)}
.searchbar label{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink)}
.tags{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:1;position:relative;overflow:hidden}
.tile.tall{grid-row:span 2;aspect-ratio:auto}
.tile .media{aspect-ratio:auto;height:100%;min-height:100%}
.tile .badge{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
/* reels */
#reels{background:#000;overflow-y:scroll;scroll-snap-type:y mandatory;color:#fff}
.reel{position:relative;height:100%;scroll-snap-align:start;overflow:hidden}
.reel .bg{position:absolute;inset:0;background-size:140% 140%;animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 40%}to{background-position:100% 60%}}
.reel .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 45%,rgba(0,0,0,.25))}
.reel .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.reel .prog i{display:block;height:100%;width:0;background:#fff;animation:prog 8s linear infinite}
@keyframes prog{to{width:100%}}
.reel .top{position:absolute;top:0;left:0;right:0;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:20px}
.rc{position:absolute;right:8px;bottom:28px;display:grid;gap:14px;justify-items:center}
.rc button{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rc button svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.rc .disk{width:38px;height:38px;border-radius:10px;border:2px solid #fff;animation:spin 5s linear infinite;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
.rinfo{position:absolute;left:16px;right:76px;bottom:26px;display:grid;gap:8px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rinfo .row{display:flex;align-items:center;gap:10px}
.follow{border:1.5px solid #fff;border-radius:8px;padding:3px 12px;font-weight:600;font-size:13px}
.follow.on{background:rgba(255,255,255,.2)}
.rinfo .snd{display:flex;align-items:center;gap:6px;font-size:12px}
/* camera */
#camera{background:#000;color:#fff;display:none;flex-direction:column}
#camera.on{display:flex}
.cam-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:#000}
.view{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:20px;overflow:hidden;background:#111}
.view .media{position:absolute;inset:0;aspect-ratio:auto;height:100%;animation:drift 12s ease-in-out infinite alternate;background-size:cover}
.view .rec{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;display:none;align-items:center;gap:6px}
.view .rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff3b30}
.recording .view .rec{display:flex}
.view .fname{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.filters{display:flex;gap:10px;padding:12px 12px 4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.fl i{width:48px;height:48px;border-radius:12px;border:2px solid transparent;overflow:hidden;display:block}
.fl.on{color:#fff}
.fl.on i{border-color:var(--accent)}
.shutter-row{display:flex;align-items:center;justify-content:space-around;padding:8px 16px 14px}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:48px;height:48px;border-radius:50%;background:#fff;display:block;transition:all .15s}
.recording .shutter i{width:26px;height:26px;border-radius:7px;background:#ff3b30}
.cam-btn{display:grid;justify-items:center;gap:2px;font-size:11px;width:60px}
.cam-btn input{display:none}
/* profile */
.phd{padding:16px;display:grid;gap:14px}
.prow{display:flex;align-items:center;gap:18px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.bio strong{font-weight:600}
.bio p{margin:2px 0 0;color:var(--muted)}
.btnrow{display:flex;gap:8px}
.btn{flex:1;background:var(--chip);border-radius:10px;padding:9px 12px;font-weight:600;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.vipcard{margin:0 16px 14px;border-radius:16px;padding:14px;display:grid;gap:10px;background:linear-gradient(135deg,#2A1D05,#4B3208);color:#FFE7B0;border:1px solid #6b4a10}
.vipcard.on{background:linear-gradient(135deg,#FFD25A,#F29100);color:#2A1800;border-color:transparent}
.vipcard .r{display:flex;align-items:center;gap:12px}
.vipcard .r div{flex:1;min-width:0}
.vipcard strong{font-family:var(--f-display);font-size:16px;display:block}
.vipcard small{opacity:.85;font-size:12px}
.vipcard .fine{font-size:11px;opacity:.7}
.switch{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:#2A1800}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#FFD25A}
.ptabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.ptabs button{padding:12px;display:grid;place-items:center;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--ink);border-color:var(--ink)}
/* nav */
#nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:4px 8px}
#nav button{height:48px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
#nav button.on{color:var(--ink)}
#nav button.on svg{stroke-width:2.4}
/* overlays */
#sheet{position:absolute;inset:0;z-index:28;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
#sheet.open{opacity:1}
#sheetBody{width:100%;max-height:82%;background:var(--surface);border-radius:22px 22px 0 0;overflow-y:auto;transform:translateY(24px);transition:transform .2s;padding:8px 16px 16px}
#sheet.open #sheetBody{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sh-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 10px;text-align:center}
.cm{display:flex;gap:10px;padding:8px 0}
.cm p{margin:0}
.cm small{color:var(--muted)}
.form{display:flex;gap:8px;margin-top:8px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.form input{flex:1;min-width:0;background:var(--chip);border:0;border-radius:12px;padding:10px 12px;outline:0}
.form button{font-weight:600;color:var(--accent);padding:0 8px}
.field{display:grid;gap:4px;margin-top:10px}
.field span{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{background:var(--chip);border:0;border-radius:12px;padding:10px 12px;outline:0;resize:none;width:100%}
.pub{display:flex;gap:12px}
.pub .media{width:96px;aspect-ratio:3/4;border-radius:12px;flex:none}
.pub .field{flex:1;margin-top:0;min-width:0}
.panel{position:absolute;inset:0;z-index:25;background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.panel.open{transform:none}
.panel .topbar{position:static}
.panel h2{font-family:var(--f-display);font-size:18px;margin:0;flex:1}
.pbody{flex:1;overflow-y:auto;min-height:0}
.thread{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.thread:hover{background:var(--chip)}
.thread .t{flex:1;min-width:0}
.thread strong{display:block;font-weight:600}
.thread small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:6px;padding:16px}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--chip);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.nt{display:flex;align-items:center;gap:12px;padding:10px 16px}
.nt p{margin:0;flex:1;min-width:0}
.nt small{color:var(--muted)}
#story{position:absolute;inset:0;z-index:30;display:none;color:#fff}
#story.open{display:block}
#story .bg{position:absolute;inset:0}
#story .bar{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
#story .bar i{display:block;height:100%;width:0;background:#fff}
#story .bar i.run{animation:prog 5s linear forwards}
#story .who{position:absolute;top:24px;left:12px;right:12px;display:flex;align-items:center;gap:10px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#story .who span{flex:1}
#story .cap{position:absolute;left:16px;right:16px;bottom:28px;font-family:var(--f-display);font-size:24px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,12px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:all .2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:11px;color:var(--muted);text-align:center;padding:14px 16px 20px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink)}
.brand span{font-family:'Allura','Brush Script MT',cursive;font-size:42px;line-height:1;margin-top:-4px}
.rinfo .row{padding:0;width:auto}
.adcta{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;background:var(--chip);font-weight:600;margin-bottom:8px}
.streak{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--chip)}
.streak .t{flex:1;min-width:0}
.streak strong{display:block;font-family:var(--f-display)}
.streak small{color:var(--muted)}
.camp{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.camp .top{display:flex;align-items:center;gap:8px}
.camp .top strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv b{display:block;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.est{background:var(--chip);border-radius:12px;padding:12px;display:grid;gap:2px}
.est b{font-family:var(--f-display);font-size:22px}
/* settings, security, lock */
.tog{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.grp{padding:6px 0;border-bottom:1px solid var(--line)}
.grp h3{margin:0;padding:10px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
button.row:hover{background:var(--chip)}
.row .t{flex:1;min-width:0}
.row strong{display:block;font-weight:500}
.row small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.seg2{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg2 button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--ink);color:var(--surface)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.err{color:var(--heart);font-size:13px;min-height:18px}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.08em;background:var(--chip);padding:10px 12px;border-radius:10px;overflow-wrap:anywhere;user-select:all}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.codes span{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border-radius:8px;padding:8px;text-align:center;user-select:all}
#lock{position:absolute;inset:0;z-index:50;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#lock.on{display:flex}
.dots{display:flex;gap:12px;height:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:12px}
.pad button{height:60px;border-radius:50%;background:var(--chip);font-family:var(--f-display);font-size:24px;font-weight:600;display:grid;place-items:center}
.pad button:disabled{opacity:.4;cursor:not-allowed}
body.away #app{filter:blur(22px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){#app{border-radius:22px}}
</style>

<div id="shell"><div id="app">
  <main id="screens">
    <section id="home" class="screen on" aria-label="Home"></section>
    <section id="explore" class="screen" aria-label="Explore"></section>
    <section id="reels" class="screen" aria-label="Reels"></section>
    <section id="camera" class="screen" aria-label="Create"></section>
    <section id="profile" class="screen" aria-label="Profile"></section>
  </main>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet" hidden><div id="sheetBody" role="dialog" aria-modal="true"></div></div>
  <div id="panel" class="panel" aria-hidden="true"></div>
  <div id="story" role="dialog" aria-label="Story"></div>
  <div id="lock" role="dialog" aria-label="App locked"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const P={
 home:'<path d="M3 11l9-7.5L21 11v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 reels:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/>',
 plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/>',
 heart:'<path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/>',
 comment:'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/>',
 send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',
 bookmark:'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
 close:'<path d="M5 5l14 14M19 5L5 19"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
 grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
 crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
 pin:'<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',
 play:'<path d="M8 5l11 7-11 7z"/>'
};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'K':String(n);

function scene(h,v=0){
  const a=`hsl(${h} 78% 62%)`,b=`hsl(${(h+50)%360} 72% 42%)`,h1=`hsl(${(h+200)%360} 45% 18%)`,h2=`hsl(${(h+190)%360} 40% 28%)`;
  const sx=[68,28,50,78][v%4], sy=[30,24,38,20][v%4];
  return `radial-gradient(circle at ${sx}% ${sy}%,rgba(255,255,255,.92) 0 5%,rgba(255,255,255,.25) 6% 11%,transparent 12%),radial-gradient(ellipse 90% 28% at 30% 100%,${h1} 0 98%,transparent 100%),radial-gradient(ellipse 80% 22% at 85% 100%,${h2} 0 98%,transparent 100%),linear-gradient(170deg,${a},${b})`;
}
const mediaStyle=m=>`background:${m.img?`url(${m.img}) center/cover`:m.bg};${m.filter&&m.filter!=='none'?`filter:${m.filter}`:''}`;
const HUES={aiza:340,bilal:200,noor:28,hamza:150,sana:280,zain:10,mehak:90,rayan:230,yourname:40};
const av=(u,c='')=>`<div class="av ${c}" style="background:linear-gradient(135deg,hsl(${HUES[u]||200} 70% 55%),hsl(${((HUES[u]||200)+40)%360} 70% 38%))" aria-hidden="true">${esc(u[0].toUpperCase())}</div>`;

const FILTERS=[
 {n:'Normal',f:'none'},
 {n:'Vintage',f:'sepia(.45) contrast(1.1) saturate(1.3) brightness(.95)'},
 {n:'Sepia',f:'sepia(1)'},
 {n:'B&W',f:'grayscale(1) contrast(1.15)'},
 {n:'Warm',f:'sepia(.25) saturate(1.5) hue-rotate(-12deg) brightness(1.05)'},
 {n:'Cyberpunk',f:'hue-rotate(250deg) saturate(2.2) contrast(1.2)'},
 {n:'Glow',f:'brightness(1.15) contrast(.9) saturate(1.3) blur(.5px)'}
];

const S={
 me:{u:'yourname',bio:'Karachi. Sunsets, chai, street photos.',vip:false,followers:1284,following:312},
 posts:[
  {id:1,u:'aiza',h:340,v:0,cap:'Clifton pe shaam, bas yehi chahiye.',loc:'Clifton Beach',likes:1240,liked:false,saved:false,tag:'sunset',com:[{u:'bilal',t:'Kya shot hai!'},{u:'noor',t:'Next time mujhe bhi le chalo'}]},
  {id:2,u:'bilal',h:200,v:1,cap:'Subah ki pehli chai aur khali sadak.',loc:'Saddar',likes:530,liked:true,saved:false,tag:'chai',com:[{u:'hamza',t:'Chai > everything'}]},
  {id:3,u:'noor',h:28,v:2,cap:'Rangon ka mela. Truck art ka koi jawab nahi.',loc:'Lyari',likes:2310,liked:false,saved:true,tag:'art',com:[{u:'aiza',t:'Yeh toh frame karwana chahiye'},{u:'sana',t:'Location bata do'},{u:'zain',t:'Mast'}]},
  {id:4,u:'hamza',h:150,v:3,cap:'Weekend trail, 14 km, ek bhi signal nahi.',loc:'Kirthar',likes:880,liked:false,saved:false,tag:'travel',com:[{u:'promo_bot',t:'Free followers! Click my link'}]}
 ],
 explore:[],
 reels:[
  {id:1,u:'sana',h:280,cap:'Biryani in 60 seconds, no cuts',snd:'Original audio - sana',likes:18400,liked:false,fol:false,com:[{u:'zain',t:'Recipe please'},{u:'mehak',t:'Dum perfect'}]},
  {id:2,u:'zain',h:10,cap:'Skate park at golden hour',snd:'Lo-fi Karachi - Hasan Beats',likes:9200,liked:false,fol:false,com:[{u:'rayan',t:'Smooth landing'}]},
  {id:3,u:'mehak',h:90,cap:'Rooftop garden tour',snd:'Morning Raga - Instrumental',likes:4310,liked:false,fol:true,com:[]},
  {id:4,u:'rayan',h:230,cap:'One take, one coffee, one cat',snd:'Original audio - rayan',likes:27600,liked:false,fol:false,com:[{u:'sana',t:'The cat wins'}]}
 ],
 myPosts:[
  {id:101,media:{bg:scene(40,0)},cap:'Chai break',tag:'chai'},
  {id:102,media:{bg:scene(210,1),filter:FILTERS[3].f},cap:'Monochrome morning',tag:'street'},
  {id:103,media:{bg:scene(320,2),filter:FILTERS[4].f},cap:'Warm evening',tag:'sunset'}
 ],
 myReels:[{id:201,media:{bg:scene(160,3)}}],
 threads:[
  {u:'aiza',msgs:[{me:false,t:'Kal beach chalein?'},{me:true,t:'Haan pakka, 5 baje?'},{me:false,t:'Done'}]},
  {u:'bilal',msgs:[{me:false,t:'Tera naya post bohat acha tha'}]},
  {u:'noor',msgs:[{me:false,t:'Truck art ki aur photos bhejna'}]}
 ],
 notes:[
  {u:'aiza',t:'liked your photo',w:'2m'},{u:'bilal',t:'started following you',w:'18m'},
  {u:'noor',t:'commented: "Kya baat hai!"',w:'1h'},{u:'hamza',t:'mentioned you in a comment',w:'3h'}
 ],
 stories:['aiza','bilal','noor','hamza','sana','zain','mehak','rayan'],
 seen:{},
 filter:0, mode:'photo', tab:'home', cam:{img:null,v:0}, camSeed:{h:30,v:0}
};
S.explore=[...S.posts.map(p=>({u:p.u,h:p.h,v:p.v,tag:p.tag,cap:p.cap})),
 ...[['sana',300,'food'],['zain',20,'sports'],['mehak',100,'garden'],['rayan',240,'cats'],['noor',60,'art'],['aiza',350,'sunset'],['hamza',170,'travel'],['bilal',190,'chai']]
  .map((x,i)=>({u:x[0],h:x[1],v:i+1,tag:x[2],cap:'#'+x[2]}))];
try{const v=localStorage.getItem('aura.vip');if(v==='1')S.me.vip=true;const f=+localStorage.getItem('aura.filter');if(f>=0&&f<FILTERS.length)S.filter=f}catch(e){}

/* ---------- helpers ---------- */
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}
function openSheet(html){$('#sheetBody').innerHTML='<div class="grab"></div>'+html;const s=$('#sheet');s.hidden=false;requestAnimationFrame(()=>s.classList.add('open'))}
function closeSheet(){const s=$('#sheet');s.classList.remove('open');setTimeout(()=>{s.hidden=true;$('#sheetBody').innerHTML=''},200)}
function vipBadge(){return S.me.vip?`<span class="vip" title="VIP">${ic('crown',11)}</span>`:''}
function burst(el){const b=$('.burst',el);if(!b)return;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}

/* ---------- nav ---------- */
const TABS=[['home','home'],['explore','search'],['reels','reels'],['camera','plus'],['profile','user']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(([id,i])=>`<button data-tab="${id}" aria-label="${id}" class="${S.tab===id?'on':''}" ${S.tab===id?'aria-current="page"':''}>${ic(i,26)}</button>`).join('');
}
function go(tab){
  S.tab=tab;
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id===tab));
  renderNav();
  if(tab==='explore')renderExplore();
  if(tab==='reels')renderReels();
  if(tab==='camera')renderCamera();
  if(tab==='profile')renderProfile();
  if(tab!=='camera')stopRec(true);
}

/* ---------- home ---------- */
function renderHome(){
  const st=S.stories.filter(u=>!S.blocked.includes(u)&&!S.muted.includes(u)).map(u=>`<button class="story" data-act="story" data-u="${u}"><div class="ring ${S.seen[u]?'seen':''}">${av(u)}</div><span>${u}</span></button>`).join('');
  $('#home').innerHTML=`
   <header class="topbar"><div class="brand" aria-label="Aura"><span>Aura</span></div>
    <div class="iconrow"><button class="ib" data-act="notes" aria-label="Notifications">${ic('bell')}<span class="dot"></span></button>
    <button class="ib" data-act="dm" aria-label="Messages">${ic('send')}</button></div></header>
   ${streakCard()}<div class="stories"><button class="story" data-act="addstory"><div class="add ring seen" style="padding:3px;position:relative">${av(S.me.u).replace('class="av ','class="av ').replace('<div','<div style="width:56px;height:56px;border:3px solid var(--surface)"')}<b>+</b></div><span>Your story</span></button>${st}</div>
   <div id="feed">${feedHTML()}</div>
   <p class="note">You are all caught up. Sample posts for the prototype.</p>`;
}
function postHTML(p){
  return `<article class="post" data-id="${p.id}">
   <div class="phead">${av(p.u,'sm')}<div class="who"><strong>${p.u}${p.mine&&S.me.vip?vipBadge():''}</strong><small>${esc(p.loc||'')}</small></div><button class="ib" data-act="postmenu" aria-label="More options">${ic('more')}</button></div>
   <div class="media" data-act="dbl" style="${mediaStyle(p.media||{bg:scene(p.h,p.v)})}"><div class="burst">${ic('heart',96)}</div></div>
   <div class="acts"><button class="ib ${p.liked?'liked':''}" data-act="like" aria-label="Like" aria-pressed="${p.liked}">${ic('heart',26)}</button>
    <button class="ib" data-act="comments" aria-label="Comments">${ic('comment',26)}</button>
    <button class="ib" data-act="share" aria-label="Share">${ic('send',26)}</button><span class="sp"></span>
    <button class="ib ${p.saved?'saved':''}" data-act="save" aria-label="Save" aria-pressed="${p.saved}">${ic('bookmark',26)}</button></div>
   <div class="ptext"><span class="likes">${likesText(p)}</span>
    <span><strong>${p.u}</strong> ${esc(p.cap)}</span>
    ${vc(p.com).length?`<button class="more" data-act="comments">View all ${vc(p.com).length} comments</button>`:`<button class="more" data-act="comments">Add a comment</button>`}</div></article>`;
}
function repost(id){const p=S.posts.find(x=>x.id==id),el=$(`.post[data-id="${id}"]`);if(!p||!el)return;el.outerHTML=postHTML(p)}
function likePost(p,force){
  if(force&&p.liked)return; p.liked=!p.liked; p.likes+=p.liked?1:-1;
}
function commentsSheet(list,title,onAdd){
  const body=c=>`<div class="cm">${av(c.u,'sm')}<div><p><strong>${esc(c.u)}</strong> ${esc(c.t)}</p></div></div>`;
  openSheet(`<h3 class="sh-title">${title}</h3><div id="cmlist">${vc(list).length?vc(list).map(body).join(''):'<p class="empty">No comments yet. Start the conversation.</p>'}</div>
   <form class="form" id="cmform"><input id="cminput" placeholder="Add a comment" autocomplete="off" aria-label="Add a comment"><button type="submit">Post</button></form>`);
  $('#cmform').onsubmit=e=>{e.preventDefault();const v=clean($('#cminput').value,300);if(!v)return;if(!allow('cm',6,60000))return toast('Slow down a little');const c={u:S.me.u,t:v};list.push(c);
    const L=$('#cmlist');if($('.empty',L))L.innerHTML='';L.insertAdjacentHTML('beforeend',body(c));$('#cminput').value='';onAdd&&onAdd()};
}

/* ---------- explore ---------- */
let exQ='',exTag='all';
function renderExplore(){
  const tags=['all',...new Set(S.explore.map(x=>x.tag))];
  $('#explore').innerHTML=`<div class="searchbar"><label>${ic('search',20)}<input id="exq" type="search" placeholder="Search users, tags and posts" aria-label="Search" value="${esc(exQ)}"></label></div>
   <div class="tags">${tags.map(t=>`<button class="chip ${exTag===t?'on':''}" data-act="tag" data-t="${t}">${t==='all'?'All':'#'+t}</button>`).join('')}</div><div id="exgrid"></div>`;
  fillExplore();
}
function fillExplore(){
  const q=exQ.toLowerCase().replace(/^[#@]/,'');
  const items=S.explore.filter(x=>!S.blocked.includes(x.u)&&(exTag==='all'||x.tag===exTag)&&(!q||x.u.includes(q)||x.tag.includes(q)||x.cap.toLowerCase().includes(q)));
  $('#exgrid').innerHTML=items.length?`<div class="grid">${items.map((x,i)=>`<button class="tile ${i%7===0?'tall':''}" data-act="tile" data-i="${S.explore.indexOf(x)}" aria-label="Post by ${x.u}"><div class="media" style="background:${scene(x.h,x.v)}"></div>${i%5===2?`<span class="badge">${ic('reels',18)}</span>`:''}</button>`).join('')}</div>`:`<p class="empty">Nothing found for "${esc(exQ)}". Try a tag like #chai or #travel.</p>`;
}

/* ---------- reels ---------- */
function renderReels(){
  $('#reels').innerHTML=reelsHTML();
}
function reelHTML(r){
  const m=r.media;
  return `<div class="reel" data-id="${r.id}" data-act="rdbl">
   <div class="bg" style="${m?`background:${m.img?`url(${m.img}) center/cover`:m.bg};${m.filter&&m.filter!=='none'?'filter:'+m.filter:''}`:`background:linear-gradient(120deg,hsl(${r.h} 80% 55%),hsl(${(r.h+60)%360} 75% 35%),hsl(${(r.h+120)%360} 70% 25%))`}"></div>
   <div class="shade"></div><div class="top">Reels</div><div class="media" style="position:absolute;inset:0;background:none;aspect-ratio:auto;pointer-events:none"><div class="burst">${ic('heart',96)}</div></div>
   <div class="rc"><button data-act="rlike" class="${r.liked?'liked':''}" aria-label="Like">${ic('heart',30)}<span>${fmt(r.likes)}</span></button>
    <button data-act="rcom" aria-label="Comments">${ic('comment',30)}<span>${r.com.length}</span></button>
    <button data-act="rshare" aria-label="Share">${ic('send',30)}<span>Share</span></button>
    <div class="disk" style="background:hsl(${r.h} 60% 30%)">${ic('music',16)}</div></div>
   <div class="rinfo"><div class="row">${av(r.u,'sm')}<strong>${r.u}</strong><button class="follow ${r.fol?'on':''}" data-act="rfollow">${r.fol?'Following':'Follow'}</button></div>
    <div>${esc(r.cap)}</div><div class="snd">${ic('music',14)}${esc(r.snd)}</div></div>
   <div class="prog"><i></i></div></div>`;
}

/* ---------- camera ---------- */
let recT=null,recS=0;
function camBg(){return S.cam.img?{img:S.cam.img}:{bg:scene(S.camSeed.h,S.camSeed.v)}}
function renderCamera(){
  const m=camBg(), f=FILTERS[S.filter];
  $('#camera').innerHTML=`
   <div class="cam-top"><button class="ib" data-act="camclose" aria-label="Close">${ic('close')}</button>
    <div class="seg" role="tablist"><button class="${S.mode==='photo'?'on':''}" data-act="mode" data-m="photo" role="tab">Photo</button><button class="${S.mode==='reel'?'on':''}" data-act="mode" data-m="reel" role="tab">Reel</button></div><span style="width:40px"></span></div>
   <div class="view"><div class="media" id="vf" style="${mediaStyle({...m,filter:f.f})}"></div><div class="rec"><span id="rt">0:00</span></div><div class="fname" id="fname">${f.n}</div></div>
   <div class="filters" role="listbox" aria-label="Filters">${FILTERS.map((x,i)=>`<button class="fl ${i===S.filter?'on':''}" data-act="filter" data-i="${i}" role="option" aria-selected="${i===S.filter}"><i style="${mediaStyle({bg:scene(30,0),filter:x.f})}"></i>${x.n}</button>`).join('')}</div>
   <div class="shutter-row"><label class="cam-btn" tabindex="0">${ic('upload',24)}Upload<input type="file" accept="image/*" id="camfile"></label>
    <button class="shutter" data-act="shutter" aria-label="${S.mode==='photo'?'Take photo':'Record reel'}"><i></i></button>
    <button class="cam-btn" data-act="newscene" aria-label="New sample scene">${ic('reels',24)}Scene</button></div>`;
  $('#camera').classList.toggle('recording',!!recT);
  $('#camfile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)loadImageFile(f)};
}
function setFilter(i){
  S.filter=i;try{localStorage.setItem('aura.filter',String(i))}catch(e){}
  $('#vf').style.filter=FILTERS[i].f==='none'?'':FILTERS[i].f;$('#fname').textContent=FILTERS[i].n;
  $$('.fl').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-selected',j===i)});
}
function stopRec(silent){if(recT){clearInterval(recT);recT=null;$('#camera').classList.remove('recording')}recS=0;if(silent&&$('#rt'))$('#rt').textContent='0:00'}
function capture(kind){
  const m=camBg();const media={...m,filter:FILTERS[S.filter].f};
  openSheet(`<h3 class="sh-title">New ${kind==='reel'?'reel':'post'}</h3>
   <div class="pub"><div class="media" style="${mediaStyle(media)}"></div>
    <label class="field"><span>Caption</span><textarea id="pcap" rows="4" placeholder="Write a caption" maxlength="200"></textarea></label></div>
   <div class="tags" style="padding:10px 0 0">${['Golden hour','Chai time','Weekend mood','Made in Karachi','#aura','#karachi','#reels','#trending'].map(x=>`<button class="chip" data-act="sugg" data-t="${x}">${x}</button>`).join('')}</div>
   <label class="field"><span>Location</span><input id="ploc" placeholder="Add location" maxlength="60"></label>
   <label class="field"><span>Tag people</span><input id="ptag" placeholder="@aiza @bilal" maxlength="80"></label>
   <button class="btn pri" id="pubbtn" style="margin-top:14px;width:100%">Publish</button>`);
  $('#pubbtn').onclick=()=>{
    if(!allow('pub',4,60000))return toast('Slow down a little');const cap=clean($('#pcap').value,200)||'New '+(kind==='reel'?'reel':'post'),loc=clean($('#ploc').value,60),tg=clean($('#ptag').value,80);
    const full=tg?cap+' '+tg:cap;
    if(kind==='reel'){S.myReels.unshift({id:Date.now(),media});S.reels.unshift({id:Date.now(),u:S.me.u,h:S.camSeed.h,media,cap:full,snd:'Original audio - '+S.me.u,likes:0,liked:false,fol:false,com:[]});}
    else{S.myPosts.unshift({id:Date.now(),media,cap:full});S.posts.unshift({id:Date.now(),u:S.me.u,mine:true,media,cap:full,loc,likes:0,liked:false,saved:false,com:[]});}
    S.cam.img=null;closeSheet();renderHome();go(kind==='reel'?'reels':'home');toast('Published');
  };
}

/* ---------- profile ---------- */
let ptab='grid';
function renderProfile(){
  const list=ptab==='grid'?S.myPosts:S.myReels;
  $('#profile').innerHTML=`
   <header class="topbar"><div class="logo" style="font-size:20px">${S.me.u}${vipBadge()}</div><div class="iconrow"><button class="ib" data-act="settings" aria-label="Settings">${ic('gear')}</button><button class="ib" data-act="dm" aria-label="Messages">${ic('send')}</button></div></header>
   <div class="phd"><div class="prow">${av(S.me.u,'lg')}<div class="stats"><div><b>${S.myPosts.length+S.myReels.length}</b><span>Posts</span></div><div><b>${fmt(S.me.followers)}</b><span>Followers</span></div><div><b>${S.me.following}</b><span>Following</span></div></div></div>

function tfaStart(){
 const sec=b32(crypto.getRandomValues(new Uint8Array(20)));
 openSheet(`<h3 class="sh-title">Set up authenticator</h3>
  <ol style="margin:0 0 10px;padding-left:18px;color:var(--muted)"><li>In your authenticator app, add an account using a setup key.</li><li>Name it Aura, enter this key, choose time-based.</li><li>Type the 6-digit code it shows.</li></ol>
  <div class="key">${sec.match(/.{4}/g).join(' ')}</div><button class="btn" id="tcopy" style="margin-top:8px;width:100%">Copy key</button>
  <label class="field"><span>6-digit code</span><input id="tcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
  <div class="err" id="terr" role="alert"></div><button class="btn pri" id="tgo" style="margin-top:8px;width:100%">Verify and turn on</button>`);
 $('#tcopy').onclick=()=>{try{navigator.clipboard.writeText(sec).then(()=>toast('Key copied')).catch(()=>toast('Select the key to copy it'))}catch(e){toast('Select the key to copy it')}};
 $('#tgo').onclick=async()=>{
  if(!allow('tfa',6,300000)){$('#terr').textContent='Too many tries. Wait a few minutes.';return}
  const c=$('#tcode').value.replace(/\s/g,'');if(!/^\d{6}$/.test(c)){$('#terr').textContent='Enter the 6 digits from your app.';return}
  if(await checkTotp(sec,c)){const codes=Array.from({length:8},rcode);SEC.twofa=sec;SEC.bk=await Promise.all(codes.map(sha));SEC.backup=8;saveSec();
   openSheet(`<h3 class="sh-title">Save your backup codes</h3><p style="margin:0;color:var(--muted)">Each code works once if you lose your phone. They will not be shown again.</p><div class="codes">${codes.map(x=>`<span>${x}</span>`).join('')}</div><button class="btn pri" id="bdone" style="width:100%">I saved them</button>`);
   $('#bdone').onclick=()=>{closeSheet();twofaPage();toast('Two-factor is on')}}
  else $('#terr').textContent='That code did not match. Check your phone clock and try again.'};
}
function tfaOff(){
 openSheet(`<h3 class="sh-title">Turn off two-factor</h3><label class="field"><span>Authenticator code or backup code</span><input id="ocode" autocomplete="one-time-code" maxlength="12"></label><div class="err" id="oerr" role="alert"></div><button class="btn pri" id="ogo" style="margin-top:8px;width:100%">Turn off</button>`);
 $('#ogo').onclick=async()=>{
  if(!allow('tfaoff',6,300000)){$('#oerr').textContent='Too many tries. Wait a few minutes.';return}
  const raw=$('#ocode').value.replace(/[\s-]/g,'').toUpperCase();let ok=false;
  if(/^\d{6}$/.test(raw))ok=await checkTotp(SEC.twofa,raw);
  else if(raw.length===8)ok=(SEC.bk||[]).includes(await sha(raw.slice(0,4)+'-'+raw.slice(4)));
  if(ok){SEC.twofa=null;SEC.backup=0;SEC.bk=[];saveSec();closeSheet();twofaPage();toast('Two-factor is off')}else $('#oerr').textContent='That code is not valid.'};
}

function extra(a,t){
 const post=t.closest('.post'),p=post&&S.posts.find(x=>x.id==post.dataset.id);

  case 'stogpriv':S.set.private=true;saveSet();renderProfile();checkupPage();break;
  case 'checkup':checkupPage();break;
  case 'applock':applockPage();break;
  case 'pinset':pinSetup();break;
  case 'pinoff':pinOff();break;
  case 'lockafter':SEC.lockAfter=+t.dataset.v;saveSec();resetIdle();applockPage();break;

  case 'myitem':myItem(t.dataset.id);break;

   if(a==='mydel'&&t.dataset.sure!=='1'){t.dataset.sure='1';$('strong',t).textContent='Tap again to delete for good';break}

   closeSheet();renderHome();renderProfile();toast(a==='myarch'?'Archived':'Deleted');break}
 }

function adReelHTML(a){return `<div class="reel" data-ad="${a.id}"><div class="bg" style="background:linear-gradient(120deg,hsl(${a.h} 70% 40%),hsl(${(a.h+50)%360} 65% 25%),hsl(${(a.h+110)%360} 60% 20%))"></div><div class="shade"></div><div class="top">Reels</div><div class="rinfo" style="right:16px"><div style="display:flex;align-items:center;gap:10px"><div class="av sm" style="background:hsl(${a.h} 60% 35%)" aria-hidden="true">${esc(a.brand[0])}</div><strong>${esc(a.brand)}</strong><span class="pill" style="background:rgba(255,255,255,.2);color:#fff">Sponsored</span></div><div>${esc(a.line)}</div><button class="follow" style="justify-self:start;padding:8px 18px;background:#fff;color:#000" data-act="adcta" data-ad="${a.id}">${esc(a.cta)}</button></div><div class="prog"><i></i></div></div>`}
function reelsHTML(){
 const l=S.reels.filter(r=>!S.blocked.includes(r.u)&&!S.muted.includes(r.u)),a=S.ads.find(x=>x.id==='a3'&&!S.adHidden.includes(x.id)),out=[];
 l.forEach((r,i)=>{out.push(reelHTML(r));if(i===1&&a)out.push(adReelHTML(a))});
 return out.join('');
}
const todayKey=()=>new Date().toLocaleDateString('en-CA');
function nextN(){const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');return G.streak.last===y?G.streak.n+1:1}
const streakReward=()=>nextN()%7===0?50:10;
function streakCard(){
 const done=G.streak.last===todayKey();
 return `<div class="streak"><div class="t"><strong>${G.streak.n?G.streak.n+'-day streak':'Start your streak'}</strong><small>${done?'Checked in today. Come back tomorrow.':'Check in to earn '+rs(streakReward())+' ad credit. Day 7 pays '+rs(50)+'.'}</small></div><button class="btn ${done?'':'pri'}" data-act="claim" ${done?'disabled':''} style="flex:none;padding:8px 14px">${done?'Done':'Check in'}</button></div>`;
}
function campStats(c){const ref=c.paused?c.pAt:Date.now(),frac=c.stopped?c.fracAtStop:Math.min(1,Math.max(0,(ref-c.start)/(c.days*60000)));return {frac,reach:Math.round(c.est*frac),clicks:Math.round(c.est*frac*c.ctr),spend:c.budget*frac,done:frac>=1&&!c.stopped}}
function campRow(c){
 const s=campStats(c),stat=c.stopped?['Stopped','']:s.done?['Completed','ok']:c.paused?['Paused','warn']:['Active','ok'];
 return `<div class="camp"><div class="top"><strong>${esc(c.title)}</strong><span class="pill ${stat[1]}">${stat[0]}</span></div>
  <div class="meter"><i style="width:${Math.round(s.frac*100)}%;background:var(--accent)"></i></div>
  <div class="kv"><div><b>${rs(s.spend)}</b><span>of ${rs(c.budget)}</span></div><div><b>${s.reach.toLocaleString()}</b><span>Reach</span></div><div><b>${s.clicks.toLocaleString()}</b><span>Clicks</span></div></div>
  ${!c.stopped&&!s.done?`<div class="btnrow"><button class="btn" data-act="camp" data-id="${c.id}" data-v="${c.paused?'resume':'pause'}">${c.paused?'Resume':'Pause'}</button><button class="btn" data-act="camp" data-id="${c.id}" data-v="stop">Stop</button></div>`:''}</div>`;
}
function adManager(){
 page('Ad Manager','settings',`<div style="padding:16px;display:grid;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><small style="color:var(--muted)">Ad credits</small><div><b style="font-family:var(--f-display);font-size:28px">${rs(G.credits)}</b></div></div><button class="btn" data-act="topup" style="flex:none">Add credits</button></div>
  <small style="color:var(--muted)">Demo mode: 1 minute counts as 1 day, and payments are simulated.</small></div>
  ${G.camps.length?G.camps.map(campRow).join(''):'<p class="empty">No promotions yet. Open one of your posts on your profile and tap Promote.</p>'}`);
}
function promoteSheet(id){
 const it=S.myPosts.find(x=>x.id==id)||S.myReels.find(x=>x.id==id);if(!it)return;
 const AUD={karachi:['Karachi',1.2],pakistan:['All Pakistan',1.0],world:['Worldwide',.7]},GOAL={visits:['Profile visits',.018],followers:['Followers',.012],site:['Link clicks',.03]},CPM=250,st={g:'visits',a:'karachi',b:1000,d:5};
 openSheet(`<h3 class="sh-title">Promote post</h3>
  <div class="pub"><div class="media" style="${mediaStyle(it.media)}"></div><div style="flex:1;min-width:0;display:grid;gap:10px">
   <div><small style="color:var(--muted)">Goal</small><div class="seg2" style="display:flex;flex-wrap:wrap">${Object.entries(GOAL).map(([k,v])=>`<button data-g="${k}" class="${k===st.g?'on':''}">${v[0]}</button>`).join('')}</div></div>
   <div><small style="color:var(--muted)">Audience</small><div class="seg2" style="display:flex;flex-wrap:wrap">${Object.entries(AUD).map(([k,v])=>`<button data-a="${k}" class="${k===st.a?'on':''}">${v[0]}</button>`).join('')}</div></div></div></div>
  <label class="field"><span>Budget <b id="bv"></b></span><input id="pb" type="range" min="500" max="20000" step="500" value="${st.b}"></label>
  <label class="field"><span>Duration <b id="dv"></b></span><input id="pd" type="range" min="1" max="14" step="1" value="${st.d}"></label>
  <div class="est" style="margin-top:12px"><small style="color:var(--muted)">Estimated reach</small><b id="er"></b><small style="color:var(--muted)">People who see your ad. Real results vary.</small></div>
  <div class="err" id="pe" role="alert"></div>
  <button class="btn pri" id="pgo" style="margin-top:8px;width:100%">Start promotion</button>
  <p class="note" style="padding:8px 0 0">You have ${rs(G.credits)} in ad credits. Payments are simulated in this prototype.</p>`);
 const est=()=>Math.round(st.b/(CPM*AUD[st.a][1])*1000);
 const upd=()=>{$('#bv').textContent=rs(st.b);$('#dv').textContent=st.d+(st.d===1?' day':' days');$('#er').textContent=Math.round(est()*.85).toLocaleString()+' to '+Math.round(est()*1.15).toLocaleString()+' people';$('#pe').textContent=''};upd();
 $('#pb').oninput=e=>{st.b=+e.target.value;upd()};$('#pd').oninput=e=>{st.d=+e.target.value;upd()};
 $$('[data-g]').forEach(b=>b.onclick=()=>{st.g=b.dataset.g;$$('[data-g]').forEach(x=>x.classList.toggle('on',x===b))});
 $$('[data-a]').forEach(b=>b.onclick=()=>{st.a=b.dataset.a;$$('[data-a]').forEach(x=>x.classList.toggle('on',x===b));upd()});
 $('#pgo').onclick=()=>{
  if(G.credits<st.b){$('#pe').textContent='Not enough ad credits. Add credits first.';return}
  G.credits-=st.b;G.camps.unshift({id:Date.now(),title:clean(it.cap||'Promoted post',60),budget:st.b,days:st.d,est:est(),ctr:GOAL[st.g][1],start:Date.now(),paused:false});saveG();closeSheet();adManager();toast('Promotion started');
 };
}
function creatorHub(){
 const imp=48200,rpm=90,share=.55,bal=Math.round(imp/1000*rpm*share),min=5000,pct=Math.min(100,Math.round(bal/min*100)),ok=S.me.followers>=1000;
 page('Creator hub','settings',`<div style="padding:16px;display:grid;gap:14px">
  <div><small style="color:var(--muted)">Estimated earnings this month, sample data</small><div><b style="font-family:var(--f-display);font-size:32px">${rs(bal)}</b></div></div>
  <div class="meter"><i style="width:${pct}%;background:var(--accent)"></i></div><small style="color:var(--muted)">${rs(bal)} of ${rs(min)} needed for your first payout</small>
  <div class="kv"><div><b>${imp.toLocaleString()}</b><span>Ad views on your content</span></div><div><b>${rs(rpm)}</b><span>Per 1,000 views</span></div><div><b>${Math.round(share*100)}%</b><span>Your share</span></div></div></div>
  <div class="grp"><h3>Monetization checklist</h3>
   ${row('1,000 followers',S.me.followers.toLocaleString()+' followers',`<span class="pill ${ok?'ok':'warn'}">${ok?'Done':'Not yet'}</span>`)}
   ${row('Account in good standing','No strikes or reports',`<span class="pill ok">Done</span>`)}
   ${row('Verify identity and payout account','Needed before the first payout, handled on the server',`<span class="pill warn">Later</span>`)}</div>
  <div style="padding:16px"><button class="btn" disabled style="width:100%;opacity:.5">Request payout</button><p class="note" style="padding:8px 0 0">Payout opens at ${rs(min)}. Easypaisa, JazzCash and bank transfer need the real backend.</p></div>`);
}
function inviteSheet(){
 const link='https://aura.app/join/'+G.ref.code,msg='Join me on Aura. '+link;
 openSheet(`<h3 class="sh-title">Invite friends</h3><p style="margin:0 0 10px;color:var(--muted)">When 5 friends join with your link you get ${rs(500)} in ad credit.</p>
  <div class="meter"><i style="width:${G.ref.joined/5*100}%;background:var(--accent)"></i></div><small style="color:var(--muted)">${G.ref.joined} of 5 joined, sample</small>
  <div class="key" style="margin-top:12px">${esc(link)}</div>
  <div class="btnrow" style="margin-top:10px"><button class="btn" id="icopy">Copy link</button><a class="btn pri" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer">WhatsApp</a></div>`);
 $('#icopy').onclick=()=>{try{navigator.clipboard.writeText(link).then(()=>toast('Link copied')).catch(()=>toast('Select the link to copy it'))}catch(e){toast('Select the link to copy it')}};
}
function extra2(a,t){
 switch(a){
  case 'claim':{if(G.streak.last===todayKey())break;const n=nextN(),r=n%7===0?50:10;G.streak={n,last:todayKey()};G.credits+=r;saveG();renderHome();toast('Day '+n+' streak. +'+rs(r)+' ad credit');break}
  case 'adcta':toast('Opens the advertiser page in the real app');break;
  case 'adhide':S.adHidden.push(t.dataset.ad);renderHome();if(S.tab==='reels')renderReels();toast('Ad hidden. We will show fewer like it.');break;
  case 'admgr':adManager();break;
  case 'topup':G.credits+=1000;saveG();adManager();toast('Added '+rs(1000)+' demo credits');break;
  case 'camp':{const c=G.camps.find(x=>x.id==t.dataset.id);if(!c)break;const v=t.dataset.v;
   if(v==='pause'){c.paused=true;c.pAt=Date.now()}else if(v==='resume'){c.start+=Date.now()-c.pAt;c.paused=false}
   else if(v==='stop'){const s=campStats(c);c.fracAtStop=s.frac;c.stopped=true;G.credits+=Math.round(c.budget*(1-s.frac));toast('Stopped. Unspent budget returned to credits.')}
   saveG();adManager();break}
  case 'promote':promoteSheet(t.dataset.id);break;
  case 'creator':creatorHub();break;
  case 'invite':inviteSheet();break;
  case 'sugg':{const ta=$('#pcap');if(ta)ta.value=((ta.value?ta.value+' ':'')+t.dataset.t).slice(0,200);break}
 }
}
applyTheme();
if(SEC.pin)lockNow();
resetIdle();
renderNav();renderHome();
</script>

</body></html>
